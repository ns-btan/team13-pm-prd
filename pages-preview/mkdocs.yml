site_name: Team 13 PRDs
site_description: Product Requirements catalog for ns-btan/team13-pm-prd
repo_url: https://github.com/ns-btan/team13-pm-prd
repo_name: ns-btan/team13-pm-prd

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.highlight

nav:
  - Home: index.md
  - NPLAN-7304 Event Streaming Client — Artifactory Support:
    - Overview: nplan-7304/index.md
    - PRD: nplan-7304/prd.md
  - Process & Schema: process.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false

extra_css:
  - _stylesheets/status-badges.css

plugins:
  - search
  - macros:
      module_name: macros
      on_error_fail: true
